<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIZZA COIN AFFILIATE PROGRAM</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-green-glow: rgba(57, 255, 20, 0.4);
            --bg-dark: #0a0c0a;
            --card-bg: #121612;
            --input-bg: #1a201a;
            --border-color: #243324;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 25px var(--neon-green-glow);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: var(--neon-green);
            text-align: center;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-green-glow);
        }

        .banner {
            background: rgba(57, 255, 20, 0.08);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--neon-green);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--neon-green);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input[type="email"],
        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="url"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green-glow);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--neon-green);
            color: #000000;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--neon-green-glow);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #32e011;
            box-shadow: 0 0 25px var(--neon-green);
            transform: translateY(-2px);
        }

        .btn-copy {
            background-color: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            margin-top: 15px;
        }

        .btn-copy:hover {
            background-color: var(--neon-green);
            color: #000000;
        }

        .result-section {
            margin-top: 25px;
            display: none;
            border-top: 1px dashed var(--neon-green);
            padding-top: 25px;
        }

        .link-box {
            background-color: var(--input-bg);
            border: 1px solid var(--neon-green);
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            color: #ffffff;
            font-family: monospace;
            font-size: 0.95rem;
            text-align: center;
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--neon-green);
            color: #000;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PIZZA COIN AFFILIATE PROGRAM</h1>
        
        <div class="banner">
            ALL AFFILIATES GET 25% OF ALL SALES GENERATED THROUGH THEIR UNIQUE LINK
        </div>

        <form id="affiliateForm">
            <div class="form-group">
                <label for="email">ENTER YOUR EMAIL</label>
                <input type="email" id="email" placeholder="yourname@example.com" required>
            </div>

            <div class="form-group">
                <label for="polygonAddress">ENTER YOUR POLYGON 0X... ADDRESS (PAYMENTS)</label>
                <input type="text" id="polygonAddress" placeholder="0x..." pattern="^0x[a-fA-F0-9]{40}$" title="Please enter a valid Polygon address starting with 0x" required>
            </div>

            <div class="form-group">
                <label for="appsScriptUrl">GOOGLE APPS SCRIPT WEB APP URL</label>
                <input type="url" id="appsScriptUrl" value="https://script.google.com/macros/s/AKfycbwkVAKCKNj-PQNCIN4utPdtpZleCIuyAKwez6KOpmB36pgTWDDmkhgh_vPBBcPosTSCNQ/exec" required>
            </div>

            <button type="submit" class="btn">CLICK TO GENERATE YOUR NEW AFFILIATE LINK</button>
        </form>

        <div id="resultSection" class="result-section">
            <label>YOUR UNIQUE AFFILIATE LINK:</label>
            <div id="affiliateLinkBox" class="link-box"></div>
            <button id="copyBtn" class="btn btn-copy">CLICK TO COPY NEW LINK</button>
        </div>
    </div>

    <div id="toast" class="toast">Registered & saved to Google Sheets!</div>

    <script>
        const form = document.getElementById('affiliateForm');
        const resultSection = document.getElementById('resultSection');
        const affiliateLinkBox = document.getElementById('affiliateLinkBox');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
           
            const email = document.getElementById('email').value.trim();
            const polygonAddress = document.getElementById('polygonAddress').value.trim();
            const endpoint = document.getElementById('appsScriptUrl').value.trim();

            if (email && polygonAddress && endpoint) {
                // Generate unique referral link
                const baseUrl = window.location.origin + window.location.pathname;
                const affiliateLink = `${baseUrl}?ref=${polygonAddress}`;

                affiliateLinkBox.textContent = affiliateLink;
                resultSection.style.display = 'block';

                // Send registration payload to Google Sheets without hanging or blocking
                const payload = {
                    action: 'registerAffiliate',
                    affiliateId: polygonAddress,
                    name: email,
                    walletAddress: polygonAddress
                };

                try {
                    await fetch(endpoint, {
                        method: 'POST',
                        mode: 'no-cors',
                        keepalive: true,
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    showToast("Registered & saved to Google Sheets!");
                } catch (err) {
                    console.error("Sheet sync error:", err);
                }
            }
        });

        copyBtn.addEventListener('click', function() {
            const linkText = affiliateLinkBox.textContent;
            navigator.clipboard.writeText(linkText).then(() => {
                showToast("Link copied to clipboard!");
            }).catch(err => {
                const tempInput = document.createElement('input');
                tempInput.value = linkText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast("Link copied to clipboard!");
            });
        });

        function showToast(msg) {
            if (msg) toast.textContent = msg;
            toast.className = "toast show";
            setTimeout(function(){
                toast.className = toast.className.replace("toast show", "toast");
            }, 3000);
        }
    </script>
</body>
</html>
